name: build release archive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      # Pin the mise CLI version to the one in based-lighting-configs/mise.
      - name: Determine mise version
        id: mise-version
        run: |
          version=$(grep -oP 'MISE_VERSION:-\Kv?[0-9]+\.[0-9]+\.[0-9]+' mise | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          version: ${{ steps.mise-version.outputs.version }}
      - name: Pre-commit
        run: exec mise x -- pre-commit run --all-files --show-diff-on-failure
  build:
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Build release archive
        run: 7z a -t7z "${{ github.event.repository.name }}-$TAG.7z" fomod/ configs/ SKSE/ meshes/ textures/ plugins/
      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "${{ github.event.repository.name }}-$TAG.7z"
