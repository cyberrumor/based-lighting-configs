name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the mise CLI version to the one in based-lighting-configs/mise.
      - name: Determine mise version
        id: mise-version
        run: |
          version=$(grep -oP 'MISE_VERSION:-\Kv?[0-9]+\.[0-9]+\.[0-9]+' mise | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          version: ${{ steps.mise-version.outputs.version }}

      - name: Pre-commit
        run: exec mise x -- pre-commit run --all-files --show-diff-on-failure
